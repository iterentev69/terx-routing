name: Sync RoscomVPN Happ routing

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

permissions:
  contents: write

concurrency:
  group: sync-roscomvpn-happ
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync upstream profile
        run: python scripts/sync_roscomvpn_happ.py

      - name: Validate JSON
        run: python -m json.tool HAPP/DEFAULT.JSON > /dev/null

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "TerX Routing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK
          git commit -m "chore: sync Happ routing from RoscomVPN"
          git push
