name: Update routing profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-routing-profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Happ and INCY profiles
        run: python scripts/update_geo.py

      - name: Validate routing JSON
        run: |
          python -m json.tool HAPP/DEFAULT.JSON > /dev/null
          python -m json.tool INCY/DEFAULT.JSON > /dev/null

      - name: Validate Happ deeplink
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path

          text = Path('HAPP/DEFAULT.DEEPLINK').read_text().strip()
          prefix = 'happ://routing/onadd/'
          assert text.startswith(prefix), 'Invalid Happ deeplink prefix'
          payload = text[len(prefix):]
          decoded_text = base64.b64decode(payload, validate=True).decode('utf-8')
          decoded = json.loads(decoded_text)
          source = json.loads(Path('HAPP/DEFAULT.JSON').read_text())
          assert decoded == source, 'HAPP/DEFAULT.DEEPLINK is not generated from HAPP/DEFAULT.JSON'
          compact = json.dumps(source, ensure_ascii=False, separators=(',', ':'))
          assert decoded_text == compact, 'Happ deeplink payload must use compact JSON'
          assert decoded['RemoteDNSIP'] == '8.8.8.8', 'Unexpected RemoteDNSIP'
          print('Happ deeplink validated')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.JSON; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "TerX Routing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.JSON
          git commit -m "chore: sync routing profiles"
          git push
