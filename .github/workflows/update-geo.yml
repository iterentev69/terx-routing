name: Update routing databases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-routing-databases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update INCY GeoIP and GeoSite references
        run: python scripts/update_geo.py

      - name: Validate routing JSON
        run: |
          python -m json.tool HAPP/DEFAULT.JSON > /dev/null
          python -m json.tool INCY/DEFAULT.JSON > /dev/null

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- INCY/DEFAULT.JSON; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "TerX Routing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add INCY/DEFAULT.JSON
          git commit -m "chore: update INCY GeoIP and GeoSite releases"
          git push
